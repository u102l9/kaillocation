name: Build APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    name: Build Kail Location APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK, NDK and CMake
        run: bash .github/scripts/setup-android-sdk.sh

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Show environment
        run: |
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          cat local.properties

      - name: Assemble Debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Assemble Release
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: List outputs
        run: find app/build/outputs -name "*.apk" | sort

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kail-location-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/**/*.apk
          generate_release_notes: true
